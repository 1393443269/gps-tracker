# GPS 追踪平台 Docker Compose
# 敏感配置通过 .env 文件注入（复制 .env.example → .env 并填入真实值）
# 不要把 .env 提交到 Git！

services:
  backend:
    build:
      context: ./server
    container_name: tracker-backend
    depends_on:
      - mqtt
      - postgres
    environment:
      - DB_BACKEND=postgres
      - DATABASE_URL=${DATABASE_URL}
      - DB_PATH=/app/data/tracker.db
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ADMIN_SECRET=${ADMIN_SECRET}
      - PORTAL_SECRET=${PORTAL_SECRET}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      # 高德 Web 服务 Key（WiFi/基站坐标换算，可选）
      # - AMAP_KEY=${AMAP_KEY}
      # 生产必须为 0；本地调试才设为 1
      - DEBUG_MODE=0
    ports:
      - "9090:9090"   # GPS 设备 TCP 接入（JT/T 808 + G618G）
    restart: unless-stopped
    networks:
      - internal
      - gps_public
    volumes:
      - tracker_data:/app/data
      - uploads_data:/app/uploads   # 头像/Logo 等上传文件持久化

  frontend:
    build:
      context: ./frontend
    container_name: tracker-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - gps_public

  mqtt:
    container_name: tracker-mqtt
    image: eclipse-mosquitto:2
    # MQTT 仅供 backend 内部使用，不对外暴露主机端口（防止外部直连）
    expose:
      - "1883"
      - "9001"
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./passwd:/mosquitto/config/passwd:ro

  postgres:
    container_name: tracker-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - pg_data:/var/lib/postgresql/data

networks:
  # 内部网络：backend ↔ mqtt ↔ postgres 通信，不对外暴露
  internal:
    driver: bridge
    internal: true
  # 公网网络：frontend 和 backend(TCP 9090) 可被外部访问
  gps_public:
    driver: bridge

volumes:
  pg_data:
    driver: local
  tracker_data:
    driver: local
  uploads_data:
    driver: local
