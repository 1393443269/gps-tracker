services:
  backend:
    build:
      context: ./server
    container_name: tracker-backend
    depends_on:
      - mqtt
      - postgres
    environment:
      - DB_BACKEND=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DB_PATH=/app/data/tracker.db
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ADMIN_SECRET=${ADMIN_SECRET}
      - PORTAL_SECRET=${PORTAL_SECRET}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - tracker_data:/app/data
      - tracker_uploads:/app/uploads
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_TDT_TOKEN=${VITE_TDT_TOKEN}
    container_name: tracker-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
  mqtt:
    container_name: tracker-mqtt
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./passwd:/mosquitto/config/passwd:ro
  postgres:
    container_name: tracker-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
    driver: local
  tracker_data:
    driver: local
  tracker_uploads:
    driver: local
