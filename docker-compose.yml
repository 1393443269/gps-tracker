# GPS 追踪平台 Docker Compose
# 敏感配置通过 .env 文件注入（复制 .env.example → .env 并填入真实值）
# 不要把 .env 提交到 Git！

services:
  backend:
    build:
      context: ./server
    container_name: tracker-backend
    depends_on:
      postgres:
        condition: service_healthy   # 等 PG 就绪再启动，避免连接池初始化失败
      mqtt:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai   # 固定容器时区，保证 datetime.now() 与部署环境一致
      - DB_BACKEND=postgres
      - DATABASE_URL=${DATABASE_URL}
      - DB_PATH=/app/data/tracker.db
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ADMIN_SECRET=${ADMIN_SECRET}
      - PORTAL_SECRET=${PORTAL_SECRET}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      # 高德 Web 服务 Key（WiFi/基站坐标换算，可选）
      # - AMAP_KEY=${AMAP_KEY}
      # 生产必须为 0；本地调试才设为 1
      - DEBUG_MODE=0
    ports:
      - "9090:9090"   # GPS 设备 TCP 接入（JT/T 808 + G618G）
    restart: unless-stopped
    networks:
      - internal
      - gps_public
    volumes:
      - tracker_data:/app/data
      - tracker_uploads:/app/uploads   # 头像/Logo 等上传文件持久化
    healthcheck:
      # 用内置 python3 打 /api/ping，不依赖 curl（slim 镜像可能无 curl）
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Gunicorn 启动 + DB 初始化约需 15-30s，给足余量
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_TDT_TOKEN=${VITE_TDT_TOKEN}
    container_name: tracker-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - gps_public
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  mqtt:
    container_name: tracker-mqtt
    image: eclipse-mosquitto:2
    # MQTT 仅供 backend 内部使用，不对外暴露主机端口（防止外部直连）
    expose:
      - "1883"
      - "9001"
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    healthcheck:
      # 带认证的 sub 一次（-C 1 收一条消息后退出，-W 3 秒超时）
      # $$SYS 在 compose 里是转义的 $，shell 展开后变成 $SYS
      test: ["CMD-SHELL",
             "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USER\" -P \"$$MQTT_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  postgres:
    container_name: tracker-postgres
    image: postgres:16-alpine
    environment:
      - TZ=Asia/Shanghai     # 容器系统时区
      - PGTZ=Asia/Shanghai   # PG 会话默认时区，保证 now()/date 运算一致
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gps} -d ${POSTGRES_DB:-gps}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'

networks:
  # 内部网络：backend ↔ mqtt ↔ postgres 通信，不对外暴露
  internal:
    driver: bridge
    internal: true
  # 公网网络：frontend 和 backend(TCP 9090) 可被外部访问
  gps_public:
    driver: bridge

volumes:
  pg_data:
    driver: local
  tracker_data:
    driver: local
  tracker_uploads:
    driver: local
