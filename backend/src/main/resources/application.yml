server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/asset_tracker?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: tracker123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JT/T 808 TCP 服务配置
tracker:
  tcp:
    port: 9090
    # 读空闲超时(秒): 超过该时间无数据则断开连接
    idle-timeout: 60

logging:
  level:
    com.qri.tracker: DEBUG
    io.netty: INFO

# JWT 配置
jwt:
  # 密钥：生产环境请替换为随机 256-bit 以上字符串，不可泄露
  secret: QriTrackerSecretKey2024!PleaseChangeInProduction!AtLeast256Bits
  # 过期时间（毫秒）：默认 24 小时
  expire: 86400000
