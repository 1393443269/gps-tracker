server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
    }

    # 上传文件（头像/Logo 等）反向代理到后端，否则会落到 SPA index.html 变成乱码
    location /uploads/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Socket.IO（Flask-SocketIO，支持 WebSocket 和长轮询两种传输）
    location /socket.io/ {
        proxy_pass          http://backend:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_read_timeout  3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript;
    gzip_min_length 1024;
}
