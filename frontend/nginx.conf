server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ── 安全响应头 ────────────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
    # CSP：允许同源 + 高德地图域（地图 SDK 需要）
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: *.amap.com; connect-src 'self' wss: *.amap.com restapi.amap.com; font-src 'self' data:; frame-ancestors 'self';" always;

    # SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        # 带 hash 的静态资源（Vite 构建产物）可以长期缓存
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        # 防止接口响应被缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 上传文件（头像/Logo 等）反向代理到后端
    location /uploads/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 透传鉴权 header，后端 serve_upload 需要 X-Admin-Token 或 X-Customer-Token
        proxy_pass_request_headers on;
    }

    # 大屏地图数据（中国/省份边界 GeoJSON）反向代理到阿里云 datav
    location /mapdata/ {
        proxy_pass          https://geo.datav.aliyun.com/;
        proxy_set_header    Host              geo.datav.aliyun.com;
        proxy_ssl_server_name on;
        proxy_set_header    Referer           "";
        proxy_read_timeout  30s;
        # 注：需要在 http{} 块配置 proxy_cache_path 才能使用缓存；
        # 当前配置仅做透传，不缓存。如需启用缓存，在 nginx.conf 外层加：
        # proxy_cache_path /var/cache/nginx/mapdata levels=1:2 keys_zone=mapdata:8m max_size=50m;
        # 并在此处加 proxy_cache mapdata; proxy_cache_valid 200 7d;
    }

    # Socket.IO（Flask-SocketIO，支持 WebSocket 和长轮询两种传输）
    location /socket.io/ {
        proxy_pass          http://backend:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_read_timeout  3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
}
