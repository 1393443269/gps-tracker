server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
    }

    # 上传文件（头像/Logo 等）反向代理到后端，否则会落到 SPA index.html 变成乱码
    location /uploads/ {
        proxy_pass          http://backend:8080;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # 大屏地图数据（中国/省份边界 GeoJSON）反向代理到阿里云 datav，
    # 避免用户浏览器直连外部服务失败导致地图空白
    location /mapdata/ {
        proxy_pass          https://geo.datav.aliyun.com/;
        proxy_set_header    Host              geo.datav.aliyun.com;
        proxy_ssl_server_name on;
        proxy_set_header    Referer           "";
        proxy_read_timeout  30s;
        # 缓存到本地，减少重复外部请求
        proxy_cache_valid   200 7d;
    }

    # Socket.IO（Flask-SocketIO，支持 WebSocket 和长轮询两种传输）
    location /socket.io/ {
        proxy_pass          http://backend:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_read_timeout  3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript;
    gzip_min_length 1024;
}
