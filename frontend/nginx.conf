# ── API 限速 zone 定义（http 上下文，conf.d/*.conf 被 include 进 http 块）──
# rate=600r/m(≈10r/s):单页加载会并发数十个 API 请求(顶栏轮询+列表+下拉选项等),
# 旧值 30r/m(每 2 秒才补 1 个令牌)会被正常业务瞬间击穿而误报 429/"请求失败"。
# 600r/m 对单个真实用户绰绰有余,配合 burst 仍能挡住恶意高频刷接口。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── 上游连接池（keepalive 避免每请求重建 TCP 到 backend）────────────────────────
upstream backend {
    server backend:8080;
    keepalive 32;   # 保持最多 32 条空闲长连接；Nginx 忙时可临时开更多
}

server {
    server_tokens off;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ── 安全响应头 ────────────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
    # CSP：允许同源 + 天地图域（地图 SDK 需要）
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' *.amap.com *.tianditu.gov.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: *.amap.com *.tianditu.gov.cn; connect-src 'self' wss: *.amap.com restapi.amap.com *.tianditu.gov.cn; font-src 'self' data:; frame-ancestors 'self';" always;

    # SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        # 带 hash 的静态资源（Vite 构建产物）可以长期缓存
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 登录接口单独严格限流(防暴力破解):5r/m + burst=3。
    # 精确匹配(location =)优先级高于下面的 /api/ 前缀匹配,会接管这两个路径。
    # 管理员登录与客户门户登录各一条,其余代理配置与 /api/ 保持一致。
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass          http://backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection       "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        gzip off;
    }
    location = /api/customer/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass          http://backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection       "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        gzip off;
    }

    # REST API 反向代理
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass          http://backend;   # 走 upstream 连接池
        proxy_http_version  1.1;             # HTTP/1.1 才支持 keep-alive
        proxy_set_header    Connection       "";   # 清除 close，让连接复用
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  60s;
        # 防止接口响应被缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # 关闭 API 响应压缩，防止 BREACH 攻击
        gzip off;
    }

    # 上传文件（头像/Logo 等）反向代理到后端
    location /uploads/ {
        client_max_body_size 10m;
        proxy_pass          http://backend;   # 走 upstream 连接池
        proxy_http_version  1.1;
        proxy_set_header    Connection       "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 透传鉴权 header，后端 serve_upload 需要 X-Admin-Token 或 X-Customer-Token
        proxy_pass_request_headers on;
        # 不再无条件加 Content-Disposition(会与后端 send_file 的 inline 头重复，
        # 导致浏览器 ERR_RESPONSE_HEADERS_MULTIPLE_CONTENT_DISPOSITION、图片/Logo 加载失败)。
        # XSS 防护改由:①下面 nosniff 防 MIME 嗅探 ②后端 serve_upload 对 svg/html 设 attachment。
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 大屏地图数据（中国/省份边界 GeoJSON）反向代理到阿里云 datav
    location /mapdata/ {
        proxy_pass          https://geo.datav.aliyun.com/;
        proxy_set_header    Host              geo.datav.aliyun.com;
        proxy_ssl_server_name on;
        proxy_set_header    Referer           "";
        proxy_read_timeout  30s;
        # 注：需要在 http{} 块配置 proxy_cache_path 才能使用缓存；
        # 当前配置仅做透传，不缓存。如需启用缓存，在 nginx.conf 外层加：
        # proxy_cache_path /var/cache/nginx/mapdata levels=1:2 keys_zone=mapdata:8m max_size=50m;
        # 并在此处加 proxy_cache mapdata; proxy_cache_valid 200 7d;
    }

    # Socket.IO（Flask-SocketIO，支持 WebSocket 和长轮询两种传输）
    location /socket.io/ {
        proxy_pass          http://backend;   # 走 upstream 连接池
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";   # WS 升级不能用 ""
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_read_timeout  3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
}
