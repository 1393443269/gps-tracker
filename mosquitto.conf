# Mosquitto MQTT Broker (Auth Enabled)
password_file /mosquitto/config/passwd
allow_anonymous false

# TCP Listener
listener 1883

# WebSocket Listener
# 注意:password_file / allow_anonymous 为全局设置(见文件顶部),
# mosquitto 2.x 不允许 password_file 重复声明,此处不再重复。
listener 9001
protocol websockets

# Logging
log_type error
log_type warning
log_type information
